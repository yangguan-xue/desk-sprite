# =====================================================================
# Desk Sprite Mosquitto ACL Configuration
# 依据规范: SPEC-002 第 1 节 通信架构、身份标识与 Topic 命名空间
# =====================================================================

# 1. 云端引擎 (Superuser - 全 Topic 读写)
user cloud_admin
topic readwrite #

# 2. Mac 宿主权限隔离 (仅读下行，仅写上行)
user host_macbook_pro
topic read sprite/host/macbook_pro/down/#
topic write sprite/host/macbook_pro/up/#

# 3. ESP32 终端权限隔离 (仅读下行，仅写上行)
user dev_esp32_c049ef
topic read sprite/device/esp32_c049ef/down/#
topic write sprite/device/esp32_c049ef/up/#
